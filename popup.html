<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      max-height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
      padding-bottom: 4px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    header h1 { font-size: 13px; font-weight: 600; }
    .gear-btn {
      background: none; border: none; cursor: pointer;
      color: #aaa; font-size: 15px; padding: 2px; line-height: 1;
    }
    .gear-btn:hover { color: #555; }

    /* ── Burn warning banner ── */
    .burn-banner {
      background: #fff7ed;
      border-bottom: 1px solid #fed7aa;
      padding: 7px 14px;
      font-size: 11px;
      color: #9a3412;
      display: none;
    }
    .burn-banner.active { display: block; }

    /* ── Sections ── */
    .section { padding: 10px 14px 4px; }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #777;
      margin-bottom: 8px;
    }

    /* ── Usage row ── */
    .usage-row { margin-bottom: 10px; }
    .usage-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .limit-name { font-size: 12px; color: #222; font-weight: 500; }
    .limit-right {
      display: flex; align-items: center; gap: 5px;
    }
    .limit-pct { font-size: 12px; font-weight: 700; }
    .burn-icon { font-size: 11px; }
    .bar-track {
      background: #d1d5db;
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
    .blue   { background: #3b82f6; }
    .yellow { background: #f59e0b; }
    .red    { background: #ef4444; }
    .reset-time { font-size: 10px; color: #888; }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 4px 0; }

    /* ── Sparkline ── */
    .spark-section { padding: 8px 14px 6px; }
    .spark-title {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: #777; margin-bottom: 6px;
    }
    .spark-wrap { position: relative; height: 44px; }
    .spark-labels {
      position: absolute; right: 0; top: 0;
      display: flex; flex-direction: column;
      justify-content: space-between;
      height: 100%;
      font-size: 9px; color: #999; text-align: right;
      pointer-events: none;
    }
    .spark-empty {
      height: 44px; display: flex;
      align-items: center; justify-content: center;
      font-size: 11px; color: #999;
    }

    /* ── Runway ── */
    .runway-section { padding: 7px 14px 5px; }
    .runway-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      min-height: 20px;
    }
    .runway-rate  { color: #666; }
    .runway-ok    { color: #16a34a; font-weight: 600; }
    .runway-time  { color: #111; font-weight: 700; }
    .runway-low   { color: #ef4444; }
    .runway-empty { font-size: 11px; color: #999; min-height: 20px; display: flex; align-items: center; }

    /* ── Heatmap ── */
    .heatmap-section { padding: 7px 14px 8px; }

    /* ── No data ── */
    .no-data {
      padding: 20px 14px;
      text-align: center;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .no-data strong { color: #555; }

    /* ── Footer ── */
    footer {
      padding: 8px 14px 10px;
      border-top: 1px solid #f0f0f0;
    }
    .timestamp { font-size: 10px; color: #888; margin-bottom: 7px; }
    .btn-row { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 11px;
      color: #444;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover { background: #f0f0f0; }
    .btn-primary {
      background: #1a1a1a; color: #fff; border-color: #1a1a1a;
    }
    .btn-primary:hover { background: #333; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Usage Monitor</h1>
    <button class="gear-btn" id="gear" title="Settings">⚙</button>
  </header>

  <div class="burn-banner" id="burn-banner"></div>
  <div id="root"></div>

  <footer>
    <div class="timestamp" id="ts"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-settings">Open Settings</button>
      <button class="btn" id="btn-refresh">Refresh</button>
      <button class="btn" id="btn-feedback" title="Leave feedback">Feedback</button>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
